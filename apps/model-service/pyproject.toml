[project]
name = "han-model-service"
version = "0.1.0"
description = "Embedding and reranker sidecar — the ONLY Python in the online path (the spec §2.1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "numpy>=1.26",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
