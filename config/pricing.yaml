# Model pricing, USD per million tokens.
#
# Cost is NOT in the OpenAI response; it is computed from this table. A model absent here
# yields costUsd: null, never a guess — §12's budget then degrades to a token cap, which the
# brief calls acceptable provided it is a decision rather than a discovery.
#
# `cachedInputPerMTok` is optional and defaults to `inputPerMTok`. The gateway reports
# `usage.prompt_tokens_details.cached_tokens`, and OpenAI's convention is that `prompt_tokens`
# INCLUDES the cached ones — so cached tokens are billed at the cached rate and the remainder
# at the input rate. Adding the two together would double-count every cache hit.
#
# Model ids are gateway-specific opaque strings. Add the ids YOUR gateway reports; they appear
# in the trace as `model` on every call.
models:
  # Rates supplied by the maintainer, 2026-09-07.
  glm-5.3:
    inputPerMTok: 2.80
    outputPerMTok: 8.80
    cachedInputPerMTok: 2.80

  glm-5.3-flash:
    inputPerMTok: 0.60
    outputPerMTok: 2.00
    cachedInputPerMTok: 0.60

  gemini-3.8-flash:
    inputPerMTok: 1.50
    outputPerMTok: 7.50
    cachedInputPerMTok: 1.50

  qwen-3.8-max:
    inputPerMTok: 4.00
    outputPerMTok: 12.00
    cachedInputPerMTok: 4.00

  # MEASURED: this gateway answers a request for qwen-3.8-max with the id qwen3.8-flash,
  # consistently. Cost is looked up by the id that SERVED the call, so without this entry
  # pricing qwen-3.8-max has no effect at all. The rates here are the ones quoted for
  # qwen-3.8-max, which is an ASSUMPTION: if the gateway is genuinely serving a cheaper model,
  # this over-states the cost. Runs carrying this substitution are flagged
  # llm_model_substituted so the assumption is visible rather than buried.
  qwen3.8-flash:
    inputPerMTok: 4.00
    outputPerMTok: 12.00
    cachedInputPerMTok: 4.00

# Every other model on the gateway is UNPRICED and reports costUsd: null. That is the honest
# state, not an oversight — see docs/TODO.md.
#
# Still unpriced and in use: qwen-3.8-max, the reasoning model that drives the agent loop.
# Until it is priced, any run that invokes the agent has costUnknown set and §12's ceiling
# stops being enforced — the token counters keep working, but the dollar limit does not.
